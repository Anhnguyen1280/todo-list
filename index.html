<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todo List</title>
    <link rel="stylesheet" href="css/style.css">
  </head>

  <body>
    <main class="app">
      <header class="app-header">
        <p class="eyebrow">Stay organized</p>
        <h1>My Todo List</h1>
        <p class="subtitle">Plan your day and finish your tasks.</p>
      </header>
      <button class="theme-button" type="button">
        Dark Mode
      </button>
    </header>
      <section class="todo-panel">
        <form class="task-form">
          <label for="task-input">New task</label>

          <div class="input-group">
            <input
              id="task-input"
              type="text"
              placeholder="What do you need to do?"
              required
            >
            <input
             id="due-date-input"
             type="date"
             lang="en"
             aria-label="Due date"
            >
            <select id="priority-input" aria-label="Priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
            </select>
            <button type="submit">Add Task</button>
          </div>
          <p class="form-error" hidden></p>
        </form>
        <input
         id="search-input"
         type="search"
         placeholder="Search tasks..."
          aria-label="Search tasks"
        >
        <div class="task-toolbar">
          <p class="task-count">0 tasks remaining</p>
          <select
            id="sort-input"
            aria-label="Sort tasks"
          >
            <option value="default">Default order</option>
            <option value="priority">Priority</option>
            <option value="due-date">Due date</option>
          </select>

          <div class="filters">
            <button class="filter-button active" type="button" data-filter="all">
              All
            </button>
            <button class="filter-button" type="button" data-filter="active">
              Active
            </button>
            <button class="filter-button" type="button" data-filter="completed">
              Completed
            </button>
          </div>
        </div>
        <div class="task-progress">
        <div class="progress-info">
        <span>Progress</span>
        <span class="progress-text">0% completed</span>
        </div>

         <div class="progress-track">
    <div class="progress-bar"></div>
  </div>
</div>

<ul class="task-list"></ul>
        
        <p class="empty-state" hidden>
           No tasks yet. Add your first task!
        </p>
        <button class="clear-completed-button" type="button">
  Clear Completed
</button>
        <button class="toggle-all-button" type="button">
  Complete All
</button>
<button class="reset-button" type="button">
  Reset All Data
</button>
      </section>
    </main>
    <div class="edit-modal" hidden>
  <div class="modal-backdrop"></div>
  

  <section
    class="modal-content"
    role="dialog"
    aria-modal="true"
    aria-labelledby="edit-modal-title"
  >
    <div class="modal-header">
      <h2 id="edit-modal-title">Edit task</h2>

      <button
        class="modal-close-button"
        type="button"
        aria-label="Close edit modal"
      >
        &times;
      </button>
    </div>
    

    <form class="edit-form">
      <label for="edit-task-input">
        Task name
      </label>

      <input
        id="edit-task-input"
        type="text"
        required
      >

      <label for="edit-due-date-input">
        Due date
      </label>

      <input
        id="edit-due-date-input"
        type="date"
      >

      <label for="edit-priority-input">
        Priority
      </label>

      <select id="edit-priority-input">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>

      <p class="edit-form-error" hidden></p>

      <div class="modal-actions">
        <button
          class="modal-cancel-button"
          type="button"
        >
          Cancel
        </button>

        <button
          class="modal-save-button"
          type="submit"
        >
          Save changes
        </button>
      </div>
      
    </form>
  </section>
</div>
<div class="delete-modal" hidden>
  <div class="delete-modal-backdrop"></div>

  <section
    class="delete-modal-content"
    role="dialog"
    aria-modal="true"
    aria-labelledby="delete-modal-title"
    aria-describedby="delete-modal-message"
  >
    <h2 id="delete-modal-title">
      Delete task?
    </h2>

    <p id="delete-modal-message">
      Are you sure you want to delete
      <strong class="delete-task-name"></strong>?
    </p>

    <div class="delete-modal-actions">
      <button
        class="delete-modal-cancel"
        type="button"
      >
        Cancel
      </button>

      <button
        class="delete-modal-confirm"
        type="button"
      >
        Delete
      </button>
    </div>
  </section>
</div>

    <div
  class="toast"
  role="status"
  aria-live="polite"
></div>
    <script src="js/app.js"></script>
  </body>
</html>
